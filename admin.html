<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKTHIVEL CRACKERS — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#07152f;--red:#b5122b;--green:#16834a;--bg:#f3f6fb;--card:#fff;--border:#e2e7ef;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif;}
body{background:var(--bg);color:#172033;padding:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;max-width:800px;margin:40px auto;box-shadow:0 12px 35px rgba(7,21,47,.10);}
h1{color:var(--navy);margin-bottom:20px;font-size:24px;}
.action-btn{border:0;padding:10px 14px;border-radius:10px;background:#174ea6;color:#fff;font-weight:800;cursor:pointer;}
.action-btn.green{background:var(--green);}
.loading{padding:20px;text-align:center;color:#697386;}
</style>
</head>
<body>
<div class="card">
  <h1>SAKTHIVEL CRACKERS — Admin Panel</h1>
  <p style="margin-bottom:15px;color:#697386;">System successfully cleaned and connected.</p>
  <button class="action-btn green" onclick="location.reload()">🔄 Refresh Panel</button>
</div>
</body>
</html>
