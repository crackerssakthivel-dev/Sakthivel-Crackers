<head>
    <meta charset="UTF-8">

    <style>
        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F5F7FA;
            color: #172033;
        }

        body.menu-open {
            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .site-header {
            width: 100%;
            height: 72px;
            background: #FFFFFF;
            border-bottom: 1px solid #E6F0FF;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 14px;

            position: relative;
            z-index: 1000;
        }


        /* =====================================================
           HEADER LEFT
        ===================================================== */

        .header-left {
            width: 48px;

            display: flex;
            align-items: center;
            justify-content: flex-start;
        }


        /* =====================================================
           HEADER CENTER / LOGO
        ===================================================== */

        .header-logo {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            height: 54px;
            width: auto;

            object-fit: contain;
        }


        /* =====================================================
           HEADER RIGHT
        ===================================================== */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }


        /* =====================================================
           HEADER BUTTONS
        ===================================================== */

        .header-icon-btn {
            width: 42px;
            height: 42px;

            border: none;
            background: transparent;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            color: #061A4A;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .header-icon-btn:hover {
            background: #E6F0FF;
            color: #2563EB;
        }

        .header-icon-btn:active {
            transform: scale(0.94);
        }


        /* =====================================================
           SVG ICONS
        ===================================================== */

        .header-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           CART COUNT
        ===================================================== */

        .cart-button {
            position: relative;
        }

        .cart-count {
            position: absolute;

            top: 2px;
            right: 1px;

            min-width: 18px;
            height: 18px;

            padding: 0 4px;

            background: #FF0000;
            color: #FFFFFF;

            border-radius: 50px;

            font-size: 10px;
            font-weight: 700;

            display: none;
            align-items: center;
            justify-content: center;
        }

        .cart-count.show {
            display: flex;
        }


        /* =====================================================
           SEARCH PANEL
        ===================================================== */

        .search-panel {
            position: absolute;

            top: 72px;
            left: 0;
            right: 0;

            background: #FFFFFF;

            padding: 14px;

            border-bottom: 1px solid #DCE8FA;

            box-shadow: 0 8px 25px rgba(6, 26, 74, 0.10);

            display: none;
        }

        .search-panel.active {
            display: block;
        }

        .search-box {
            width: 100%;
            height: 46px;

            border: 2px solid #4169E1;
            border-radius: 10px;

            padding: 0 14px;

            font-size: 16px;
            outline: none;

            color: #172033;
        }

        .search-box:focus {
            border-color: #1E40AF;
            box-shadow: 0 0 0 3px rgba(65, 105, 225, 0.12);
        }


        /* =====================================================
           DARK OVERLAY
        ===================================================== */

        .menu-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 1090;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }


        /* =====================================================
           SIDE MENU
        ===================================================== */

        .side-menu {
            position: fixed;

            top: 0;
            left: 0;

            width: min(86vw, 370px);
            height: 100vh;

            background: #FFFFFF;

            z-index: 1100;

            transform: translateX(-100%);

            transition: transform 0.3s ease;

            display: flex;
            flex-direction: column;

            box-shadow: 8px 0 30px rgba(0, 0, 0, 0.15);
        }

        .side-menu.active {
            transform: translateX(0);
        }


        /* =====================================================
           MENU HEADER
        ===================================================== */

        .menu-header {
            min-height: 100px;

            background:
                linear-gradient(
                    135deg,
                    #061A4A,
                    #1E40AF
                );

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 16px;
        }

        .menu-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-logo {
            width: 58px;
            height: 58px;

            object-fit: contain;

            background: #FFFFFF;

            border-radius: 12px;

            padding: 4px;
        }

        .menu-brand-name {
            color: #FFFFFF;

            font-size: 15px;
            font-weight: 800;

            line-height: 1.25;
        }

        .menu-brand-subtitle {
            margin-top: 4px;

            color: #E6F0FF;

            font-size: 11px;
        }


        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        .menu-close {
            width: 40px;
            height: 40px;

            border: none;

            background: rgba(255, 255, 255, 0.12);

            color: #FFFFFF;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .menu-close:hover {
            background: rgba(255, 255, 255, 0.22);
        }


        /* =====================================================
           MENU ITEMS
        ===================================================== */

        .menu-content {
            flex: 1;

            overflow-y: auto;

            padding: 12px;
        }

        .menu-item {
            width: 100%;

            min-height: 52px;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 0 14px;

        .menu-item:hover {
            background: #E6F0FF;
            color: #1E40AF;
        }

        .menu-item:active {

        }

        .menu-item-icon {
            width: 23px;
            height: 23px;

            color: #4169E1;

            flex-shrink: 0;

        /* =====================================================
           MENU CONTACT AREA
        ===================================================== */

        .menu-contact-box {
            margin: 6px 12px 16px;

            background: #F5F7FA;

            border: 1px solid #E6F0FF;

        .menu-contact-title {

    </style>

    <script>

        /* -----------------------------------------------------
           ELEMENTS
        ----------------------------------------------------- */

        const menuOpenButton =
            document.getElementById("menuOpenButton");

        const menuCloseButton =
            document.getElementById("menuCloseButton");

        const sideMenu =
            document.getElementById("sideMenu");

        const menuOverlay =
            document.getElementById("menuOverlay");

        const searchButton =
            document.getElementById("searchButton");

        const searchPanel =
            document.getElementById("searchPanel");

        const searchInput =
            document.getElementById("searchInput");

        const cartButton =
            document.getElementById("cartButton");


        /* -----------------------------------------------------
           OPEN MENU
        ----------------------------------------------------- */

        function openMenu() {

            sideMenu.classList.add("active");

            menuOverlay.classList.add("active");

            document.body.classList.add("menu-open");

        }


        /* -----------------------------------------------------
           CLOSE MENU
        ----------------------------------------------------- */

        function closeMenu() {

            sideMenu.classList.remove("active");

            menuOverlay.classList.remove("active");

            document.body.classList.remove("menu-open");

        }


        /* -----------------------------------------------------
           MENU EVENTS
        ----------------------------------------------------- */

        menuOpenButton.addEventListener(
            "click",
            openMenu
        );

        menuCloseButton.addEventListener(
            "click",
            closeMenu
        );

        menuOverlay.addEventListener(
            "click",
            closeMenu
        );


        /* -----------------------------------------------------
           SEARCH
        ----------------------------------------------------- */

        searchButton.addEventListener(
            "click",
            () => {

                searchPanel.classList.toggle("active");

                if (searchPanel.classList.contains("active")) {

                    setTimeout(() => {
                        searchInput.focus();
                    }, 100);

                }

            }
        );


        /* -----------------------------------------------------
           ESC KEY
        ----------------------------------------------------- */

        document.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Escape") {

                    closeMenu();

                    searchPanel.classList.remove("active");

                }

            }
        );


        /* -----------------------------------------------------
           CART
           
           Cart functionality will be connected later
           when we build the Cart section.
        ----------------------------------------------------- */

        cartButton.addEventListener(
            "click",
            () => {

                alert(
                    "Cart section will be connected in the next step."
                );

            }
        );

    </script>
