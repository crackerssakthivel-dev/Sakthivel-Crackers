<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAKTHIVEL CRACKERS</title>

    <style>

        /* =====================================================
           ROYAL BLUE COLOR SYSTEM
        ===================================================== */

        :root {
            --deep-blue: #1E40AF;
            --royal-blue: #4169E1;
            --bright-blue: #2563EB;
            --deep-blue: #1E40AF;
            --light-blue: #E6F0FF;
            --white: #FFFFFF;
            --gold: #FFD700;
            --red: #FF0000;
            --dark-text: #172033;
        }


        /* =====================================================
           BASIC RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #F5F7FA;
            color: var(--dark-text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body.menu-open {
            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .site-header {
            width: 100%;
            height: 72px;

            background: var(--deep-royal-blue);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 12px;

            position: relative;
            z-index: 1000;

            box-shadow:
                0 3px 12px rgba(6, 26, 74, 0.25);
        }


        /* =====================================================
           LEFT SIDE / HAMBURGER
        ===================================================== */

        .header-left {
            width: 48px;

            display: flex;
            align-items: center;
        }


        /* =====================================================
           CENTER LOGO
        ===================================================== */

        .header-logo-link {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
        }

        .header-logo {
            width: auto;
            height: 54px;

            max-width: 210px;

            object-fit: contain;
        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .header-actions {
            display: flex;
            align-items: center;

            gap: 3px;
        }


        /* =====================================================
           HEADER ICON BUTTON
        ===================================================== */

        .header-icon-btn {
            position: relative;

            width: 43px;
            height: 43px;

            border: none;
            border-radius: 10px;

            background: transparent;

            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.15s ease;
        }

        .header-icon-btn:hover {
            background: rgba(65, 105, 225, 0.35);
        }

        .header-icon-btn:active {
            transform: scale(0.93);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .header-icon {
            width: 24px;
            height: 24px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           CART COUNT
        ===================================================== */

        .cart-count {
            position: absolute;

            top: 2px;
            right: 1px;

            min-width: 18px;
            height: 18px;

            padding: 0 4px;

            border-radius: 50px;

            background: var(--red);
            color: var(--white);

            font-size: 10px;
            font-weight: 800;

            display: none;

            align-items: center;
            justify-content: center;

            border: 2px solid var(--deep-royal-blue);
        }

        .cart-count.show {
            display: flex;
        }


        /* =====================================================
           SEARCH PANEL
        ===================================================== */

        .search-panel {
            position: absolute;

            top: 72px;
            left: 0;
            right: 0;

            padding: 14px;

            background: var(--white);

            border-bottom:
                2px solid var(--royal-blue);

            box-shadow:
                0 8px 24px rgba(6, 26, 74, 0.18);

            display: none;
        }

        .search-panel.active {
            display: block;
        }

        .search-input {
            width: 100%;
            height: 46px;

            border:
                2px solid var(--royal-blue);

            border-radius: 10px;

            padding: 0 14px;

            background: var(--white);

            color: var(--dark-text);

            font-size: 15px;

            outline: none;
        }

        .search-input:focus {
            border-color: var(--bright-blue);

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* =====================================================
           MENU OVERLAY
        ===================================================== */

        .menu-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(6, 26, 74, 0.48);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 1090;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }


        /* =====================================================
           SIDE MENU
        ===================================================== */

        .side-menu {
            position: fixed;

            top: 0;
            left: 0;

            width: min(86vw, 380px);
            height: 100vh;

            background: var(--white);

            z-index: 1100;

            transform: translateX(-100%);

            transition:
                transform 0.3s ease;

            display: flex;
            flex-direction: column;

            box-shadow:
                8px 0 30px rgba(6, 26, 74, 0.22);
        }

        .side-menu.active {
            transform: translateX(0);
        }


        /* =====================================================
           MENU TOP
        ===================================================== */

        .menu-top {
            min-height: 105px;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--deep-royal-blue),
                    var(--deep-blue)
                );

            display: flex;

            align-items: center;
            justify-content: space-between;
        }


        /* =====================================================
           MENU BRAND
        ===================================================== */

        .menu-brand {
            display: flex;

            align-items: center;

            gap: 11px;
        }

        .menu-logo {
            width: 58px;
            height: 58px;

            object-fit: contain;

            background: var(--white);

            border-radius: 10px;

            padding: 3px;
        }

        .menu-brand-name {
            color: var(--white);

            font-size: 15px;

            font-weight: 800;

            line-height: 1.25;
        }

        .menu-brand-subtitle {
            margin-top: 4px;

            color: var(--gold);

            font-size: 10px;

            font-weight: 700;
        }


        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        .menu-close {
            width: 40px;
            height: 40px;

            border: none;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.12);

            color: var(--white);

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .menu-close:hover {
            background:
                rgba(255,255,255,0.22);
        }


        /* =====================================================
           MENU CONTENT
        ===================================================== */

        .menu-content {
            flex: 1;

            overflow-y: auto;

            padding: 12px;
        }


        /* =====================================================
           MENU ITEM
        ===================================================== */

        .menu-item {
            width: 100%;

            min-height: 52px;

            margin-bottom: 7px;

            padding: 0 14px;

            border: none;

            border-radius: 10px;

            background: var(--white);

            color: var(--dark-text);

            display: flex;

            align-items: center;

            gap: 13px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.15s ease;
        }

        .menu-item:hover {
            background: var(--light-blue);

            color: var(--deep-blue);
        }

        .menu-item:active {
            transform: scale(0.98);
        }


        /* =====================================================
           MENU ICON
        ===================================================== */

        .menu-item-icon {
            width: 22px;
            height: 22px;

            color: var(--royal-blue);

            flex-shrink: 0;
        }


        /* =====================================================
           CONTACT INFORMATION
        ===================================================== */

        .menu-contact {
            margin: 4px 12px 16px;

            padding: 14px;

            border-radius: 12px;

            background: var(--light-blue);

            border:
                1px solid rgba(65, 105, 225, 0.20);
        }

        .menu-contact-title {
            color: var(--deep-royal-blue);

            font-size: 12px;

            font-weight: 800;

            margin-bottom: 9px;

            text-transform: uppercase;
        }

        .menu-contact-line {
            margin-top: 7px;

            color: var(--dark-text);

            font-size: 12px;

            line-height: 1.45;
        }

        .menu-contact-line strong {
            color: var(--deep-blue);
        }


        /* =====================================================
           DESKTOP / LAPTOP
        ===================================================== */

            .site-header {

            }

                right: 28px;

                width: 430px;

                border-radius:
                    0 0 12px 12px;
            }

            .side-menu {
                width: 390px;
            }
        }

    </style>
</head>

    <script>

        const openMenu =
            document.getElementById("openMenu");

        const closeMenu =
            document.getElementById("closeMenu");

        const sideMenu =
            document.getElementById("sideMenu");

        const menuOverlay =
            document.getElementById("menuOverlay");

        const searchButton =
            document.getElementById("searchButton");

        const searchPanel =
            document.getElementById("searchPanel");

        const searchInput =
            document.getElementById("searchInput");


        /* OPEN MENU */

        function showMenu() {

            sideMenu.classList.add("active");

            menuOverlay.classList.add("active");

            document.body.classList.add("menu-open");

        }


        /* CLOSE MENU */

        function hideMenu() {

            sideMenu.classList.remove("active");

            menuOverlay.classList.remove("active");

            document.body.classList.remove("menu-open");

        }


        openMenu.addEventListener(
            "click",
            showMenu
        );


        closeMenu.addEventListener(
            "click",
            hideMenu
        );


        menuOverlay.addEventListener(
            "click",
            hideMenu
        );


        /* SEARCH */

        searchButton.addEventListener(
            "click",
            () => {

                searchPanel.classList.toggle("active");

                if (
                    searchPanel.classList.contains("active")
                ) {

                    setTimeout(
                        () => searchInput.focus(),
                        100
                    );

                }

            }
        );


        /* ESC */

        document.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Escape") {

                    hideMenu();

                    searchPanel.classList.remove(
                        "active"
                    );

                }

            }
        );

    </script>
